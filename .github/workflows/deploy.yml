name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: 빌드
        run: ./gradlew bootJar -x test

      - name: EC2 배포
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # PEM 키 설정
          echo "$EC2_SSH_KEY" > pitchmate-key.pem
          chmod 400 pitchmate-key.pem

          # JAR 파일 EC2로 전송
          JAR_FILE=$(ls build/libs/*.jar | grep -v plain)
          scp -i pitchmate-key.pem -o StrictHostKeyChecking=no \
            $JAR_FILE ubuntu@$EC2_HOST:/home/ubuntu/app/pitchmate-server.jar

          # EC2에서 서비스 재시작
          ssh -i pitchmate-key.pem -o StrictHostKeyChecking=no ubuntu@$EC2_HOST << EOF
            sudo systemctl stop pitchmate || true

            # 환경변수 업데이트
            sudo tee /etc/pitchmate.env > /dev/null << ENVEOF
          GEMINI_API_KEY=${GEMINI_API_KEY}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          ENVEOF

            sudo systemctl start pitchmate
            sudo systemctl status pitchmate --no-pager
          EOF
