name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: 빌드
        run: ./gradlew bootJar -x test

      - name: EC2 배포
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > pitchmate-key.pem
          chmod 400 pitchmate-key.pem

          JAR_FILE=$(ls build/libs/*.jar | grep -v plain)
          scp -i pitchmate-key.pem -o StrictHostKeyChecking=no \
            $JAR_FILE ubuntu@$EC2_HOST:/home/ubuntu/app/pitchmate-server.jar

          cat > env_file << EOF
          GEMINI_API_KEY=$GEMINI_API_KEY
          AWS_S3_BUCKET=pitchmate-videos-kr
          SPRING_DATASOURCE_URL=jdbc:postgresql://pitchmate-db.cfegkq4qyt35.ap-northeast-2.rds.amazonaws.com:5432/pitchmate
          SPRING_DATASOURCE_USERNAME=pitchmate
          SPRING_DATASOURCE_PASSWORD=WooJun1011!
          JWT_SECRET=pitchmateSecretKeyForJwtTokenGenerationAndValidation2024SecureKey
          JWT_ACCESS_TOKEN_EXPIRATION=1800000
          JWT_REFRESH_TOKEN_EXPIRATION=604800000
          CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,https://pitch-mate-capstone.vercel.app,https://pitch-mate-new-fe.vercel.app
          SPRING_JPA_HIBERNATE_DDL_AUTO=update
          SERVER_PORT=8080
          SERVER_FORWARD_HEADERS_STRATEGY=framework
          SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=500MB
          SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=500MB
          EOF

          scp -i pitchmate-key.pem -o StrictHostKeyChecking=no \
            env_file ubuntu@$EC2_HOST:/home/ubuntu/env_file

          ssh -i pitchmate-key.pem -o StrictHostKeyChecking=no ubuntu@$EC2_HOST \
            "sudo mv /home/ubuntu/env_file /etc/pitchmate.env && sudo systemctl restart pitchmate"
